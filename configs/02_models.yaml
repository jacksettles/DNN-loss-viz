model:
  name: "MiniCNN"

  params:
    in_channels: 3
    num_classes: 10
    activation: "relu"
    classifier_hidden_dims: [128]

    conv_layers:
      - out_channels: 32
        kernel_size: 3
        stride: 1
        padding: 1
        use_batch_norm: true
        use_max_pool: true
        use_skip_connection: false

      - out_channels: 64
        kernel_size: 3
        stride: 1
        padding: 1
        use_batch_norm: true
        use_max_pool: true
        use_skip_connection: false

      - out_channels: 128
        kernel_size: 3
        stride: 1
        padding: 1
        use_batch_norm: true
        use_max_pool: true
        use_skip_connection: false

      - out_channels: 256
        kernel_size: 3
        stride: 1
        padding: 1
        use_batch_norm: true
        use_max_pool: true
        use_skip_connection: false